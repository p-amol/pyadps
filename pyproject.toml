[tool.poetry]
name = "pyadps"
version = "1.0.0dev0"
description = "A Python package for ADCP data processing"
authors = ["P. Amol <prakashamol@gmail.com>"]
readme = "README.md"
license = "MIT"
keywords = ["adcp", "data-processing", "oceanography"]
include = [
  { path = "pyadps/io/metadata/*.000", format = [
    "sdist",
    "wheel",
  ] },
  { path = "pyadps/io/metadata/*.json", format = [
    "sdist",
    "wheel",
  ] },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.poetry.urls]
homepage = "https://pyadps.readthedocs.io/en/latest/index.html"
Documentation = "https://pyadps.readthedocs.io/en/latest/index.html"
Repository = "https://github.com/p-amol/pyadps"

[tool.poetry.dependencies]
python = "<4.0.0,>=3.12"
streamlit = "~=1.36.0"
numpy = "~=1.26.4"
matplotlib = "~=3.8.4"
scipy = "~=1.14.0"
cmake = ">=3.30.2"
pandas = "~=2.2.2"
netCDF4 = "~=1.7.1"
plotly = "~=5.22.0"
plotly-resampler = "~=0.10.0"
meson = ">=1.4.1"
pygeomag = "^1.1.0"
xarray = "~=2024.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.0"     # added: required for --cov support
ruff = "^0.5.0"
pandas-stubs = "^2.2.0"
pyright = "^1.1.0"
mypy = "^1.10.0"


[tool.poetry.group.docs.dependencies]
sphinx = ">=8.0,<9.0"
myst-nb = "^1.3.0"
sphinx-rtd-theme = "^3.1.0"
sphinx-autoapi = "^3.6.1"
myst-parser = "^5.0.0"

[tool.poetry.scripts]
run-pyadps = "pyadps.__main__:main"
run-auto = "pyadps.legacy.autoprocess:main"
run-script = "pyadps.legacy.script:main"

[tool.pyright]
typeCheckingMode = "standard"
include = ["src/pyadps"]
exclude = ["src/pyadps/legacy"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
# PYTEST
# =============================================================================
# Run all tests with coverage:  pytest
# Run only page tests:          pytest tests/pages/
# Run a single file:            pytest tests/pages/test_01_Read_File.py
# Skip coverage (quick run):    pytest --no-cov

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-v",
  # IMPORTANT: use directory paths (src/pyadps/pages), NOT module names
  # (pyadps.pages). AppTest runs pages via exec() not import(), so
  # coverage's import hook never fires — directory paths bypass this.
  "--cov=src/pyadps/pages",
  "--cov=src/pyadps/processing",
  "--cov=src/pyadps/io",
  "--cov-report=term-missing",
  "--cov-report=html:coverage_html",
]

# =============================================================================
# COVERAGE
# =============================================================================

[tool.coverage.run]
source = [
  "src/pyadps/pages",      # Streamlit pages — exec()'d by AppTest
  "src/pyadps/processing", # ProcessedDataset, runners, config, etc.
  "src/pyadps/io",         # Binary reader, pd0 parser, accessors, etc.
]
relative_files = true # keeps .coverage paths portable across machines / CI

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "st.stop()",                  # Streamlit early-exit guard lines give false misses
]
